<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071a0f">
<title>Offline · The Dugout</title>
<style>
  @font-face { font-family: 'Geist'; src: url('/fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'NType 82'; src: url('/fonts/NType82.woff2') format('woff2'); }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #eef3ea; font-family: Geist, system-ui, sans-serif; text-align: center;
    background: radial-gradient(90% 60% at 50% 0%, rgba(243,231,195,.08), transparent 70%), repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 60px, transparent 60px 120px), linear-gradient(180deg, #0c2a1a, #071a0f 60%, #041008); }
  main { display: grid; gap: 14px; max-width: 340px; }
  img { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto; }
  h1 { margin: 0; font-family: 'NType 82', Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1; }
  p { margin: 0; color: #a8b9a7; line-height: 1.5; }
  a { justify-self: center; margin-top: 6px; padding: 14px 26px; border-radius: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; color: #1a1200; background: linear-gradient(180deg, #ffdf8a, #f5c04a 50%, #b9851c); }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Live auctions need an internet connection. Your room and squad are kept on the server, so jump back in once you're online.</p>
  <a href="/">Try again</a>
</main>
</body>
</html>
